name: Shyraq CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "fix/**"
      - "security-*"
  pull_request:
    branches: ["main", "security-hardening-2026-10-07"]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

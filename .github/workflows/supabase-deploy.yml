name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Reconcile superseded historical migration
        shell: bash
        run: |
          set -euo pipefail
          # 20261009173000 and 20261009173500 define the same two RPCs.
          # The latter is the final version already present in production; the former
          # is a superseded local file that Supabase otherwise rejects as out of order.
          # Repair updates only the migration-history ledger; it does not execute SQL.
          # Keep the normal dry-run immediately after this step to validate all real
          # pending migrations before any schema change is deployed.
          supabase migration repair 20261009173000 --status applied --db-url "$SUPABASE_DB_URL"
      - name: Validate pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Deploy migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
